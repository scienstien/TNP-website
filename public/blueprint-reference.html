<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blueprint hero background</title>
<style>
  :root {
    --base: #08090c;
    --blue: #0a4bff;
    --blue-deep: #021a4d;
    --line: rgba(110, 160, 255, 0.5);
    --text: #e8eefc;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--base); }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); }

  .hero { position: relative; min-height: 100%; overflow: hidden; background: var(--base); isolation: isolate; }
  .layer { position: absolute; inset: 0; pointer-events: none; }

  /* 1. Blue glow bleeding in from the bottom-left */
  .glow {
    background:
      radial-gradient(ellipse 40% 65% at 0% 90%, rgba(10,75,255,.55) 0%, rgba(10,75,255,.25) 20%, rgba(2,26,77,.5) 45%, transparent 75%);
  }

  /* 2. Grid, only visible on the right side via a radial mask */
  .grid {
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 8% 14%;
    -webkit-mask-image: radial-gradient(ellipse 60% 80% at 80% 40%, #000 0%, transparent 80%);
            mask-image: radial-gradient(ellipse 60% 80% at 80% 40%, #000 0%, transparent 80%);
    opacity: .95;
  }

  /* 3. The building: grayscale + dimmed, faded out toward the left */
  .building {
    left: 28%;
    filter: grayscale(1) brightness(.5) contrast(1.08);
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 42%);
            mask-image: linear-gradient(90deg, transparent 0%, #000 42%);
  }
  .building img { position: absolute; right: calc(8% - 55px); bottom: -3%; height: 78%; width: auto; max-width: none; }
  @media (max-width: 700px) { .building { left: 0; opacity: .6; } .building img { height: 60%; right: -20%; } }

  /* 4. Dashed arc + markers */
  .overlay svg { width: 100%; height: 100%; }
  .arc { fill: none; stroke: rgba(180,200,255,.35); stroke-width: 1; stroke-dasharray: 3 5; }
  .plus { stroke: #3d7bff; stroke-width: 1.5; }
  .ring { fill: none; stroke: rgba(200,215,255,.6); stroke-width: 1; }

  /* 5. Soft vignette so the photo melts into the dark base */
  .vignette {
    background:
      linear-gradient(180deg, rgba(8,9,12,.55) 0%, transparent 25%),
      linear-gradient(0deg, rgba(8,9,12,.5) 0%, transparent 30%);
  }

  .content { position: relative; z-index: 2; padding: clamp(24px, 6vw, 80px); max-width: 560px; margin-top: 12vh; }
  h1 { font-size: clamp(32px, 5vw, 56px); line-height: 1.05; margin: 0 0 16px; font-weight: 600; letter-spacing: -0.02em; }
  p { color: rgba(232,238,252,.72); line-height: 1.6; margin: 0; font-size: 17px; max-width: 46ch; }
</style>
</head>
